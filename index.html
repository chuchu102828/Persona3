<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#0f172a;font-family:system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
.stars{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 18%,#bae6fd,transparent),radial-gradient(1px 1px at 42% 82%,#fff,transparent),radial-gradient(1.5px 1.5px at 86% 66%,#fde68a,transparent),radial-gradient(1px 1px at 10% 70%,#bae6fd,transparent),radial-gradient(1px 1px at 58% 50%,#fff,transparent)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fl{animation:fl 5s ease-in-out infinite}.fi{animation:fi .3s ease both}
@media (prefers-reduced-motion:reduce){.fl,.fi{animation:none}}

main.res{background:transparent!important;border:0!important;box-shadow:none!important;padding:0!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.rk-item{position:relative;touch-action:pan-y}
.rk-item.dragging{z-index:5;border-color:#fbbf24;box-shadow:0 10px 26px rgba(0,0,0,.55);cursor:grabbing}
.rk-item .grip{touch-action:none;cursor:grab}
.rc{container-type:inline-size;position:relative;overflow:hidden;text-align:left;color:#e5e9ff;border-radius:28px;border:1.5px solid rgba(139,120,255,.55);box-shadow:0 0 28px rgba(99,102,241,.35),0 20px 40px rgba(0,0,0,.5);background:radial-gradient(circle at 70% 28%,rgba(124,58,237,.3),transparent 55%),radial-gradient(circle at 20% 85%,rgba(59,130,246,.2),transparent 50%),linear-gradient(180deg,#0a0d2c,#150f46 55%,#0a0e30)}
.rc:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 8%,#c4b5fd,transparent),radial-gradient(1px 1px at 88% 56%,#fff,transparent),radial-gradient(1.5px 1.5px at 6% 52%,#93c5fd,transparent),radial-gradient(1px 1px at 76% 78%,#fff,transparent),radial-gradient(1px 1px at 30% 92%,#c4b5fd,transparent)}
.rc>*{position:relative}
.rc-hero{aspect-ratio:1652/1560}
.rc-hero>*{position:absolute}
.rc-title{left:5cqw;top:9cqw;width:51cqw;padding:3cqw 2cqw 3.2cqw;border-radius:6cqw;border:1.5px solid rgba(170,150,255,.65);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:0 0 18px rgba(139,92,246,.45),inset 0 0 14px rgba(255,255,255,.08);transform:rotate(-4deg);text-align:center}
.rc-title svg{position:absolute;left:14%;top:-6cqw;width:12cqw;filter:drop-shadow(0 0 1.5cqw rgba(251,191,36,.7))}
.rc-title h2{margin:0;font-weight:900;line-height:1.1;font-size:9.2cqw;letter-spacing:.02em}
.rc-title h2 span{display:block;background:linear-gradient(180deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 .6cqw .8cqw rgba(0,0,0,.45))}
.rc-title h2 span+span{background-image:linear-gradient(180deg,#fff,#f0abfc)}
.rc-tags{left:6cqw;top:34cqw;display:flex;gap:1.6cqw;white-space:nowrap}
.rc-tags span{font-weight:800;font-size:3.4cqw;color:#fff;padding:1.1cqw 2.2cqw;border-radius:99px;box-shadow:0 1cqw 2cqw rgba(0,0,0,.4),inset 0 .4cqw .6cqw rgba(255,255,255,.35)}
.rc-tags .t1{background:linear-gradient(180deg,#fb7185,#e11d48);transform:rotate(-7deg)}
.rc-tags .t2{background:linear-gradient(180deg,#60a5fa,#1d4ed8);transform:rotate(-5deg)}
.rc-radar{left:58.7cqw;top:6.4cqw;width:36.3cqw;aspect-ratio:200/236;border-radius:5cqw;border:1px solid rgba(139,120,255,.45);background:rgba(10,14,50,.55)}
.rc-radar svg{display:block;width:100%;height:100%}
.rc-char{left:32.5cqw;top:40cqw;width:35cqw;pointer-events:none;-webkit-user-drag:none}
.sk{display:flex;flex-direction:column;align-items:center;gap:1cqw;transform:translateX(-50%);font-size:3.6cqw;font-weight:700;color:#f6d99a;white-space:nowrap;text-shadow:0 0 1cqw rgba(0,0,0,.8)}
.sk i{display:grid;place-items:center;width:8.5cqw;height:8.5cqw;border-radius:50%;border:.35cqw solid #a78bfa;background:rgba(139,92,246,.18);box-shadow:0 0 2cqw rgba(167,139,250,.55)}
.sk.b i{border-radius:2.2cqw;border-color:#38bdf8;background:rgba(56,189,248,.22);box-shadow:0 0 2cqw rgba(56,189,248,.6)}
.sk svg{width:4.6cqw;height:4.6cqw}
.rc-quote{margin:0 4.5cqw;padding:4cqw 4.5cqw;border-radius:5cqw;border:1px solid rgba(139,120,255,.45);background:rgba(12,16,58,.72)}
.rc-quote b{display:block;font-size:5.2cqw;line-height:1.4;color:#f7deb0;font-weight:800}
.rc-quote p{margin:1.5cqw 0 0;font-size:3.9cqw;line-height:1.6;color:#98a2c4}
.rc-pts{display:grid;grid-template-columns:1fr 1fr;gap:3cqw;margin:3.5cqw 4.5cqw 0}
.rc-pt{font:inherit;color:inherit;text-align:left;cursor:pointer;padding:3cqw;border-radius:5cqw;border:1px solid rgba(139,120,255,.5);background:rgba(12,16,58,.72);transition:transform .15s,border-color .15s}
.rc-pt:hover{border-color:#fbbf24}.rc-pt:active{transform:scale(.97)}
.rc-pt .hd{display:flex;align-items:center;gap:1.6cqw;margin-bottom:2cqw;font-size:4.4cqw;font-weight:800;color:#fff}
.rc-pt .hd svg{width:5.4cqw;height:5.4cqw}
.rc-pt .bd{display:flex;align-items:center;justify-content:space-between;gap:1cqw;height:17cqw;border-radius:3.5cqw;background:#2b3570;overflow:hidden;padding-right:3cqw}
.rc-pt .bd img{height:100%;width:auto;max-width:50%;object-fit:cover}
.rc-pt .nm{font-size:5cqw;font-weight:800;color:#fff}
.rc-more{display:flex;align-items:center;justify-content:center;gap:2.5cqw;width:calc(100% - 9cqw);margin:3.5cqw 4.5cqw 4.5cqw;padding:3.4cqw;border-radius:99px;font:inherit;font-size:5cqw;font-weight:800;color:#fff;cursor:pointer;border:1px solid rgba(147,197,253,.6);background:linear-gradient(90deg,#2d4496,#25307e);box-shadow:0 0 3cqw rgba(99,102,241,.4)}
.rc-more:active{transform:scale(.98)}.rc-more svg{width:6cqw;height:6cqw}
@keyframes pop{from{opacity:0;transform:translateY(-28px) scale(.4)}to{opacity:1;transform:none}}.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3) both}
</style></head>
